name: Template repositories E2E

on:
  workflow_dispatch:

permissions:
  contents: read

# Keep updates to the three persistent repositories in order.
concurrency:
  group: pkgfactory-template-repositories
  cancel-in-progress: false

jobs:
  generate:
    name: ${{ matrix.package }}.jl
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [PkgFactoryMinimum, PkgFactorySimple, PkgFactoryAllInOne]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Install PkgFactory dependencies
        run: julia --project=. --startup-file=no -e 'import Pkg; Pkg.instantiate()'
      - name: Publish template and verify history
        id: generate
        env:
          GH_TOKEN: ${{ secrets.PKGFACTORY_E2E_TOKEN }}
          PKGFACTORY_E2E_OWNER: ${{ vars.PKGFACTORY_E2E_OWNER }}
          PKGFACTORY_E2E_PACKAGE: ${{ matrix.package }}
        run: julia --project=. --startup-file=no test/e2e/repositories.jl
      - name: Test generated package
        env:
          GENERATED_PACKAGE: ${{ steps.generate.outputs.package_path }}
          JET_TEST: 'true'
        run: julia --startup-file=no -e 'import Pkg; Pkg.activate(ENV["GENERATED_PACKAGE"]); Pkg.test()'
