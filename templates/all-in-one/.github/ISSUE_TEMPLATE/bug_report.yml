name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include the smallest code example and the complete error output.
      render: julia
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Julia environment
      description: Paste the output of `versioninfo()` and `using Pkg; Pkg.status()`.
      render: text
    validations:
      required: true
